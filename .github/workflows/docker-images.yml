name: Docker images

on:
  pull_request:
  push:
    branches: [master, SCRUM-55-docker-images-ci]   # temporary branch for testing docker images ci
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.image }})   
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    
    strategy:
      fail-fast: false   
      matrix:
        include:
          - image: web
            context: ./web
          - image: nao-robot-api
            context: ./team-19-social-robot/naoRobotAPI
          - image: skeleton-finder-api
            context: ./team-19-social-robot/skeletonFinderAPI
          - image: translator
            context: ./team-19-social-robot/translator
          - image: voice-command-api
            context: ./team-19-social-robot/voiceCommandAPI
          - image: exercise-config-service
            context: ./team-19-social-robot/exerciseConfigService
          - image: audio-to-text-converter
            context: ./team-19-social-robot/audioToTextConverter

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/team26fiitstu/${{ matrix.image }}   
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}                      
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}