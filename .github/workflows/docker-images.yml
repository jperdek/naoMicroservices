   name: Docker images

   on:
     pull_request:
     push:
       branches: [master]

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: docker/setup-buildx-action@v3
         - uses: docker/build-push-action@v6
           with:
             context: ./team-19-social-robot/voiceCommandAPI
             push: false